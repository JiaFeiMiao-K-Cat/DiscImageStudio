[project]
name = "disc-calib"
version = "0.1.0"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "scipy>=1.18.1",
]

[project.scripts]
disc-calib = "disc_calib.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

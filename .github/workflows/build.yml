name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for a release
        required: false
        type: string
      release_tag:
        description: Upload the tested CLI archives for this release
        required: false
        type: string

permissions:
  contents: read

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, rid: linux-x64 }
          - { runner: ubuntu-24.04-arm, rid: linux-arm64 }
          - { runner: macos-15-intel, rid: osx-x64 }
          - { runner: macos-15, rid: osx-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      RID: ${{ matrix.rid }}
      PACKAGE_TAG: ${{ inputs.release_tag || 'ci' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish and archive the self-contained CLI
        shell: bash
        run: |
          archive="DiscImageStudio-CLI-$PACKAGE_TAG-$RID.tar.gz"
          dotnet publish src/DiscImageStudio.Cli/DiscImageStudio.Cli.csproj \
            -c Release -r "$RID" --self-contained true -o "$RUNNER_TEMP/publish" \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          mkdir -p artifacts/cli
          tar -czf "artifacts/cli/$archive" -C "$RUNNER_TEMP/publish" disc-image-studio \
            -C "$GITHUB_WORKSPACE" LICENSE THIRD-PARTY-NOTICES.txt
          (cd artifacts/cli && shasum -a 256 "$archive" > "$archive.sha256")

      - name: Test the extracted CLI on the target platform
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/cli-smoke"
          tar -xzf "artifacts/cli/DiscImageStudio-CLI-$PACKAGE_TAG-$RID.tar.gz" -C "$RUNNER_TEMP/cli-smoke"
          python3 tests/test_cli_package.py "$RUNNER_TEMP/cli-smoke/disc-image-studio"

      - uses: actions/upload-artifact@v4
        if: inputs.release_tag != ''
        with:
          name: cli-${{ inputs.release_tag }}-${{ matrix.rid }}
          path: artifacts/cli/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  linux-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, rid: linux-x64 }
          - { runner: ubuntu-24.04-arm, rid: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth desktop-file-utils appstream shellcheck

      - name: Lint packaging scripts and desktop metadata
        run: |
          shellcheck packaging/linux/build.sh
          shellcheck -s sh packaging/linux/install.sh
          shellcheck -s bash -e SC2034,SC2154,SC2164 packaging/linux/arch/PKGBUILD
          desktop-file-validate packaging/linux/data/*.desktop
          appstreamcli validate --no-net packaging/linux/data/*.metainfo.xml

      - name: Test the Linux GUI services and view models
        run: dotnet run --project tests/DiscImageStudio.LinuxTests --configuration Release

      - name: Build the self-contained Linux bundle
        run: ./packaging/linux/build.sh --rid "$RID" --output artifacts/linux-gui

      - name: Install into a scratch prefix and test the installed app
        run: |
          bundle=(artifacts/linux-gui/DiscImageStudio-*-"$RID")
          prefix="$RUNNER_TEMP/prefix"
          "${bundle[0]}/install.sh" --prefix "$prefix"
          desktop-file-validate "$prefix"/share/applications/*.desktop
          python3 tests/test_cli_package.py "$prefix/bin/disc-image-studio"
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            "$prefix/bin/disc-image-studio-gui" --screenshot artifacts/linux-gui/screenshots --theme dark
          "${bundle[0]}/install.sh" --prefix "$prefix" --uninstall
          test ! -e "$prefix/bin/disc-image-studio-gui"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-gui-screenshots-${{ matrix.rid }}
          path: artifacts/linux-gui/screenshots/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: inputs.release_tag != ''
        with:
          name: linux-gui-${{ inputs.release_tag }}-${{ matrix.rid }}
          path: |
            artifacts/linux-gui/*.tar.gz
            artifacts/linux-gui/*.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DiscImageStudio.slnx

      - name: Validate release tooling
        run: ./tests/Test-ReleaseTooling.ps1

      - name: Build
        run: dotnet build DiscImageStudio.slnx --configuration Release --no-restore

      - name: Test module architecture
        run: dotnet run --project tests/DiscImageStudio.ArchitectureTests --configuration Release --no-build

      - name: Test original DVD engine
        run: dotnet run --project src/DvdImageSolver --configuration Release --no-build -- selftest

      - name: Test DVD through module catalog
        run: dotnet run --project src/DiscImageStudio.App --configuration Release --no-build -- selftest

      - name: Smoke-test CD module
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path artifacts\ci -Force | Out-Null
          dotnet run --project src/DiscImageStudio.App --configuration Release --no-build -- cd-generate --input src/DiscImageStudio.App/Assets/DiscImageStudio-256.png --output artifacts/ci/cd-smoke.raw --r0 24.5 --r1 24.6 --sectors 2 --velocity 1100 --theta0 0 --outer 57.5 --interleave true
          if ($LASTEXITCODE -ne 0) { throw "CD smoke generation failed." }
          if ((Get-Item artifacts\ci\cd-smoke.raw).Length -ne 4704) {
            throw "CD smoke output was not exactly two 2352-byte sectors."
          }

      - name: Render GUI screenshot
        run: dotnet run --project src/DiscImageStudio.App --configuration Release --no-build -- ui-snapshot --output artifacts/store/home-screen.png

      - uses: actions/upload-artifact@v4
        with:
          name: validation-artifacts
          path: |
            artifacts/ci/cd-smoke.raw
            artifacts/store/home-screen.png

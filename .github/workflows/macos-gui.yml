name: macos-gui

on:
  push:
    branches: [main]
    paths:
      - "macos/**"
      - "src/DiscImageStudio.Cli/**"
      - "src/Shared/**"
      - "src/DiscImageStudio.Core/**"
      - "src/DiscImageStudio.ImageIO/**"
      - "src/DiscImageStudio.Cd/**"
      - "src/DiscImageStudio.Dvd/**"
      - "src/DiscImageStudio.BluRay/**"
      - "src/DvdImageSolver/**"
      - "src/DiscImageStudio.Iso/**"
      - "tests/test_cli_package.py"
      - ".github/workflows/macos-gui.yml"
  pull_request:
    paths:
      - "macos/**"
      - "src/DiscImageStudio.Cli/**"
      - "src/Shared/**"
      - "src/DiscImageStudio.Core/**"
      - "src/DiscImageStudio.ImageIO/**"
      - "src/DiscImageStudio.Cd/**"
      - "src/DiscImageStudio.Dvd/**"
      - "src/DiscImageStudio.BluRay/**"
      - "src/DvdImageSolver/**"
      - "src/DiscImageStudio.Iso/**"
      - "tests/test_cli_package.py"
      - ".github/workflows/macos-gui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      # ---- 签名与公证（未配置时自动退化为 ad-hoc，fork PR 也能正常构建） ----
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # 公证凭据二选一：Apple ID + App 专用密码，或 App Store Connect API Key。
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      MACOS_SIGN_IDENTITY: ""
      MACOS_TEAM_ID: ""
      KEYCHAIN_PATH: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 签名证书通过 p12（base64）注入；没有 secret 时保持 ad-hoc。
      - name: Import Developer ID certificate
        if: ${{ env.APPLE_CERTIFICATE_P12 != '' }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          python3 -c 'import base64, os, sys; sys.stdout.buffer.write(base64.b64decode(os.environ["APPLE_CERTIFICATE_P12"]))' > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/^ *//;s/"//g')
          IDENTITY="${APPLE_SIGNING_IDENTITY:-}"
          if [[ -z "$IDENTITY" ]]; then
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          fi
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::导入的证书里没有 Developer ID Application 身份"
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "已导入签名身份：$IDENTITY"

      - name: Prepare App Store Connect API key
        if: ${{ env.APPLE_API_KEY_P8 != '' }}
        run: |
          set -euo pipefail
          python3 -c 'import base64, os, sys; sys.stdout.buffer.write(base64.b64decode(os.environ["APPLE_API_KEY_P8"]))' > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # runner 是 macos-15（arm64），build-cli.sh 默认推断出 osx-arm64，
      # 产物落在 macos/build/cli/osx-arm64/disc-image-studio。
      - name: Build the self-contained CLI
        run: macos/scripts/build-cli.sh

      - name: Smoke-test the published CLI
        run: python3 tests/test_cli_package.py macos/build/cli/osx-arm64/disc-image-studio

      - name: Run Swift package tests
        run: |
          cd macos
          swift test

      # build-app.sh 同时构建并内置原生流式刻录助手 disc-burn-stream（SwiftPM product）。
      # 有 MACOS_SIGN_IDENTITY 时用 Developer ID + hardened runtime；否则 ad-hoc。
      - name: Build the .app bundle with the bundled CLI and burn helper
        run: macos/scripts/build-app.sh

      - name: Verify code signature
        run: |
          set -euo pipefail
          APP="macos/build/DiscImageStudio.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Authority=|TeamIdentifier=|flags=" || true

      - name: Notarize and staple the .app
        if: >-
          ${{ env.MACOS_SIGN_IDENTITY != '' &&
              ((env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != '') ||
               (env.APPLE_API_KEY_PATH != '' && env.APPLE_API_KEY_ID != '' && env.APPLE_API_ISSUER_ID != '')) }}
        run: macos/scripts/notarize.sh --app macos/build/DiscImageStudio.app

      # hdiutil 在 runner 上创建临时镜像需要额外空间；.build 与 CLI 发布目录
      # 在 .app 组装完成后已不再需要（CLI 已内置），先清掉避免 "No space left"。
      - name: Free disk space for the DMG
        run: |
          set -euo pipefail
          df -h /
          rm -rf macos/.build macos/build/cli
          df -h /

      # 生成 zip + 拖动安装 DMG；有 MACOS_SIGN_IDENTITY 时 package-app.sh 会用
      # Developer ID 给 DMG 签名，随后对 DMG 单独公证并 stapling。
      - name: Package the .app (zip + DMG)
        run: macos/scripts/package-app.sh

      - name: Notarize and staple the .dmg
        if: >-
          ${{ env.MACOS_SIGN_IDENTITY != '' &&
              ((env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != '') ||
               (env.APPLE_API_KEY_PATH != '' && env.APPLE_API_KEY_ID != '' && env.APPLE_API_ISSUER_ID != '')) }}
        run: |
          set -euo pipefail
          DMG="$(ls -t macos/build/*.dmg | head -n 1)"
          macos/scripts/notarize.sh --app "$DMG"

      - name: Upload the packaged app
        uses: actions/upload-artifact@v4
        with:
          name: DiscImageStudio-macos-app
          path: |
            macos/build/*.zip
            macos/build/*.dmg
            macos/build/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Clean up signing keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true

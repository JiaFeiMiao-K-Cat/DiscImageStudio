name: release

on:
  push:
    branches: [main]
    paths:
      - Directory.Build.props
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  metadata:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.changes.outputs.enabled }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a version change together with changelog changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_COMMIT: ${{ github.event.before }}
        run: |
          "enabled=false" >> $env:GITHUB_OUTPUT
          if ($env:EVENT_NAME -eq 'push') {
            if ($env:BEFORE_COMMIT -match '^0+$') {
              'Initial repository push: use the manual release entry after setup.' >> $env:GITHUB_STEP_SUMMARY
              exit 0
            }
            $changed = @(git diff --name-only $env:BEFORE_COMMIT HEAD -- Directory.Build.props CHANGELOG.md)
            if ($LASTEXITCODE -ne 0) { throw 'Cannot compare the release changes.' }
            if ('Directory.Build.props' -notin $changed -or 'CHANGELOG.md' -notin $changed) {
              'Skipped: update the version and changelog together to release.' >> $env:GITHUB_STEP_SUMMARY
              exit 0
            }
            $previousXml = git show "${env:BEFORE_COMMIT}:Directory.Build.props"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read the previous version.' }
            [xml]$previous = $previousXml -join "`n"
            $prefixNode = $previous.SelectSingleNode('/Project/PropertyGroup/VersionPrefix')
            $suffixNode = $previous.SelectSingleNode('/Project/PropertyGroup/VersionSuffix')
            if ($null -eq $prefixNode) {
              # The initial policy setup moves the existing version out of the app project.
              $previousAppXml = git show "${env:BEFORE_COMMIT}:src/DiscImageStudio.App/DiscImageStudio.App.csproj"
              if ($LASTEXITCODE -ne 0) { throw 'Cannot read the legacy app version.' }
              [xml]$previousApp = $previousAppXml -join "`n"
              $previousVersion = $previousApp.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
            } else {
              $previousVersion = $prefixNode.InnerText
              if ($null -ne $suffixNode -and $suffixNode.InnerText) { $previousVersion += '-' + $suffixNode.InnerText }
            }
            $current = ./packaging/Get-ReleaseMetadata.ps1
            if ($current.Version -ceq $previousVersion) {
              'Skipped: the configured version has not changed.' >> $env:GITHUB_STEP_SUMMARY
              exit 0
            }
          }
          "enabled=true" >> $env:GITHUB_OUTPUT

      - name: Validate version, main ancestry and release notes
        if: steps.changes.outputs.enabled == 'true'
        id: release
        run: |
          $metadata = ./packaging/Get-ReleaseMetadata.ps1 -RequireReleaseNotes
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the release commit.' }
          git merge-base --is-ancestor $commit origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit must belong to origin/main.' }
          "tag=$($metadata.Tag)" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "prerelease=$($metadata.Prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  validate:
    needs: metadata
    if: needs.metadata.outputs.enabled == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}
      release_tag: ${{ needs.metadata.outputs.tag }}

  package:
    needs: [metadata, validate]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false

      - name: Collect tested desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: windows-${{ needs.metadata.outputs.tag }}-*
          path: artifacts/release-downloads/windows

      - name: Collect tested CLI archives
        uses: actions/download-artifact@v4
        with:
          pattern: cli-${{ needs.metadata.outputs.tag }}-*
          path: artifacts/release-downloads/cli

      - name: Verify and collect tested packages, then prepare release notes
        run: |
          $metadata = ./packaging/Get-ReleaseMetadata.ps1 -Tag $env:RELEASE_TAG -RequireReleaseNotes
          $directory = Join-Path (Join-Path $PWD.Path 'artifacts/release') $metadata.Tag
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $manifest = Join-Path $directory 'SHA256SUMS.txt'
          $packages = @()
          foreach ($rid in 'win-x64','win-arm64') {
            $packages += "DiscImageStudio-$($metadata.Tag)-$rid.exe"
          }
          foreach ($rid in 'linux-x64','linux-arm64','osx-x64','osx-arm64') {
            $packages += "DiscImageStudio-CLI-$($metadata.Tag)-$rid.tar.gz"
          }
          # Artifact uploads may retain version/RID directories. Flatten only the
          # six expected packages after checking their adjacent checksum files.
          $downloadedFiles = @(Get-ChildItem -LiteralPath 'artifacts/release-downloads' -File -Recurse)
          $hashes = @()
          foreach ($package in $packages) {
            $packageMatches = @($downloadedFiles | Where-Object { $_.Name -ceq $package })
            if ($packageMatches.Count -ne 1) {
              throw "Expected exactly one tested package named $package; found $($packageMatches.Count)."
            }
            $path = $packageMatches[0].FullName
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $line = "$hash  $package"
            if ((Get-Content -LiteralPath "$path.sha256" -Raw).Trim() -cne $line) {
              throw "Downloaded package checksum does not match for $package."
            }
            Copy-Item -LiteralPath $path -Destination (Join-Path $directory $package)
            $hashes += $line
          }
          $checksum = $hashes -join "`n"
          [IO.File]::WriteAllText($manifest, "$checksum`n", [Text.UTF8Encoding]::new($false))
          $notes = @(
            $metadata.Notes
            ''
            '### 下载与运行 / Download and run'
            ''
            'Windows 桌面版请按处理器选择：Intel / AMD x64 使用 win-x64.exe（Windows 10 2004+ / Windows 11 x64）；ARM64 使用 win-arm64.exe（Windows 11 ARM64）。两个版本均内置 .NET 运行时，下载后可直接运行。'
            '这些便携 EXE 未进行 Windows Authenticode 代码签名；启用可选 PGP 签名时，Release 会另行提供分离签名文件。即时流式刻录仍为实验性功能；硬件实测范围以仓库验证记录为准。'
            '**Linux 和 macOS 命令行版为实验性功能。** 按系统和处理器选择自包含的 tar.gz，解压后运行 `./disc-image-studio --help`。macOS 的 arm64 对应 Apple 芯片，x64 对应 Intel。'
            ''
            'Choose the Windows desktop package for your CPU: win-x64.exe for Intel / AMD x64 (Windows 10 2004+ / Windows 11 x64), or win-arm64.exe for ARM64 (Windows 11 ARM64). Both include the .NET runtime and run directly after download.'
            'These portable EXEs are not Authenticode-signed. Optional detached PGP signatures may be provided as separate release assets. Live streaming burn remains experimental; see the repository validation records for tested hardware coverage.'
            '**The Linux and macOS CLIs are experimental.** Extract the self-contained tar.gz matching your OS and CPU, then run `./disc-image-studio --help` in that directory. On macOS, arm64 is Apple silicon and x64 is Intel.'
            ''
            '### SHA-256'
            ''
            '使用 Windows 的 Get-FileHash、Linux 的 sha256sum 或 macOS 的 shasum -a 256 检查下载文件，并与对应文件名的校验值比较。'
            'Use Get-FileHash on Windows, sha256sum on Linux or shasum -a 256 on macOS and compare the result with the entry for your filename.'
            ''
            '```powershell'
            "Get-FileHash .\DiscImageStudio-$($metadata.Tag)-win-x64.exe -Algorithm SHA256"
            '```'
            ''
            '```text'
            $checksum
            '```'
            ''
            '### 源代码与构建 / Source and build'
            ''
            '从本页的 Source code (zip / tar.gz) 下载完整对应源代码；构建说明见下方 README 链接。'
            'Download the complete corresponding source from Source code (zip / tar.gz) on this page. Build instructions are in the README linked below.'
            ''
            "构建说明 / Build instructions: [简体中文 README]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/$env:RELEASE_COMMIT/README.md) | [English README]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/$env:RELEASE_COMMIT/README.en.md)"
            ''
            "源码提交 / Source commit: $env:RELEASE_COMMIT"
          ) -join "`n"
          Set-Content -LiteralPath (Join-Path $directory 'release-notes.md') -Value $notes -Encoding utf8
        env:
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}

      - name: Generate update manifest
        run: |
          ./packaging/New-UpdateManifest.ps1 `
            -ReleaseDirectory (Join-Path 'artifacts/release' $env:RELEASE_TAG) `
            -Tag $env:RELEASE_TAG `
            -Repository $env:GITHUB_REPOSITORY `
            -ServerUrl $env:GITHUB_SERVER_URL

      - name: Add update manifest to checksums
        run: |
          $directory = Join-Path 'artifacts/release' $env:RELEASE_TAG
          $manifest = Join-Path $directory 'latest.json'
          $checksumPath = Join-Path $directory 'SHA256SUMS.txt'
          $hash = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::AppendAllText($checksumPath, "$hash  latest.json`n", [Text.UTF8Encoding]::new($false))

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.metadata.outputs.tag }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/release/${{ needs.metadata.outputs.tag }}/*.exe
            artifacts/release/${{ needs.metadata.outputs.tag }}/*.tar.gz
            artifacts/release/${{ needs.metadata.outputs.tag }}/latest.json
            artifacts/release/${{ needs.metadata.outputs.tag }}/SHA256SUMS.txt
            artifacts/release/${{ needs.metadata.outputs.tag }}/release-notes.md

  draft:
    needs: [metadata, package]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      IS_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.metadata.outputs.tag }}
          path: release

      - name: Verify release attachments
        working-directory: release
        shell: bash
        run: sha256sum --strict --check SHA256SUMS.txt

      - name: Cache sequoia sq
        uses: actions/cache@v4
        env:
          SIGN_PRIVATE_KEY: ${{ secrets.RELEASE_SIGN_KEY }}
        if: ${{ env.SIGN_PRIVATE_KEY != '' }}
        id: cache_sq
        with:
          path: |
            ./sequoia/bin
          key: sequoia-sq-binary-cache
      - name: Build Sequoia SQ with OpenSSL
        shell: bash
        env:
          SIGN_PRIVATE_KEY: ${{ secrets.RELEASE_SIGN_KEY }}
        if: ${{ env.SIGN_PRIVATE_KEY != '' && steps.cache_sq.outputs.cache-hit !='true'}}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang nettle-dev pkg-config libssl-dev capnproto libsqlite3-dev
          cargo install sequoia-sq \
            --locked \
            --no-default-features \
            --features crypto-openssl \
            --root "./sequoia"
      - name: Append sequoia to path
        shell: bash
        env:
          SIGN_PRIVATE_KEY: ${{ secrets.RELEASE_SIGN_KEY }}
        if: ${{ env.SIGN_PRIVATE_KEY != '' }}
        run: echo "$PWD/sequoia/bin" >> "$GITHUB_PATH"
      - name: Sign release artifacts
        shell: bash
        env:
          SIGN_PRIVATE_KEY: ${{ secrets.RELEASE_SIGN_KEY }}
        if: ${{ env.SIGN_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          trap 'shred -n 32 -u private_key.pgp; echo "Cleaned up private key."' EXIT
          umask 077
          ## No PQC support (sequoia pgp with nettle)
          # sudo apt-get update
          # sudo apt-get install -y sq
          printf '%s\n' "$SIGN_PRIVATE_KEY" >private_key.pgp
          files=(release/*.exe release/*.tar.gz release/SHA256SUMS.txt release/latest.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No files found to sign"
            exit 1
          fi
          
          for file in "${files[@]}"; do
            # Sign file with sequoia sq
            sq sign --signer-file private_key.pgp --signature-file="${file}.sig" "${file}"
          done
          # Export Public Key
          sq key delete \
            --cert-file private_key.pgp \
            --output release/public_key.asc
      - name: Verify release artifacts with public key
        shell: bash
        env:
          SIGN_PRIVATE_KEY: ${{ secrets.RELEASE_SIGN_KEY }}
        if: ${{ env.SIGN_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          umask 077
          files=(release/*.exe release/*.tar.gz release/SHA256SUMS.txt release/latest.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No files found to verify"
            exit 1
          fi
          for file in "${files[@]}"; do
            # Check if file exists 
            if [ ! -f "${file}.sig" ]; then
              echo "Signature file doesn't exist"
              exit 1
            fi
            # Verify file with sequoia sq
            sq verify --signer-file release/public_key.asc --signature-file="${file}.sig" "${file}"
          done
      - name: Create or refresh draft with all release attachments
        run: |
          # Never replace assets on an already published release.
          $pages = gh api --paginate --slurp "repos/$env:GH_REPO/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing releases.' }
          $existing = @($pages | ConvertFrom-Json | ForEach-Object { $_ } |
            Where-Object { $_.tag_name -ceq $env:RELEASE_TAG })
          if ($existing.Count -gt 1) { throw 'Multiple releases have the requested tag.' }
          if ($existing.Count -eq 1 -and -not $existing[0].draft) {
            throw 'This release is already public. Publish fixes under a new version.'
          }

          $refsJson = gh api "repos/$env:GH_REPO/git/matching-refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect the release tag.' }
          $matchingTags = @($refsJson | ConvertFrom-Json | Where-Object { $_.ref -ceq "refs/tags/$env:RELEASE_TAG" })
          if ($matchingTags.Count -eq 0) {
            $createdTag = gh api --method POST "repos/$env:GH_REPO/git/refs" `
              -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$env:RELEASE_COMMIT"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create the release tag.' }
            $remoteTag = $createdTag | ConvertFrom-Json
          } else {
            $remoteTag = $matchingTags[0]
          }
          $tagObject = $remoteTag.object
          while ($tagObject.type -eq 'tag') {
            $annotatedTag = gh api "repos/$env:GH_REPO/git/tags/$($tagObject.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the annotated tag.' }
            $tagObject = $annotatedTag.object
          }
          if ($tagObject.type -ne 'commit' -or $tagObject.sha -ne $env:RELEASE_COMMIT) {
            throw 'The release tag already points to a different commit. Use a new version.'
          }

          $assets = @(Get-ChildItem -Path 'release/*.exe','release/*.tar.gz','release/*.sig','release/*.asc' -File | ForEach-Object FullName)
          $assets += 'release/latest.json'
          $assets += 'release/SHA256SUMS.txt'
          $options = @('--title', "Disc Image Studio $env:RELEASE_TAG", '--notes-file', 'release/release-notes.md')
          if ($existing.Count -eq 1) {
            gh release upload $env:RELEASE_TAG @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
            gh release edit $env:RELEASE_TAG @options --draft=true "--prerelease=$env:IS_PRERELEASE"
          } else {
            $options += @('--draft', '--verify-tag', '--target', $env:RELEASE_COMMIT)
            if ($env:IS_PRERELEASE -eq 'true') { $options += '--prerelease' }
            gh release create $env:RELEASE_TAG @assets @options
          }
          if ($LASTEXITCODE -ne 0) { throw 'Saving the draft release failed.' }
          "Draft ready: https://github.com/$env:GH_REPO/releases" >> $env:GITHUB_STEP_SUMMARY
